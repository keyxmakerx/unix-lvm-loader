[package]
name = "unix-lvm-loader"
version = "0.1.0"
description = "LUKS/LVM boot loader manager with multi-distro support"
authors = ["keyxmakerx"]
license = "MIT"
repository = "https://github.com/keyxmakerx/unix-lvm-loader"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4" }

[dependencies]
# Tauri core
tauri = { version = "2.10.0" }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# UUID generation for backup naming
uuid = { version = "1", features = ["v4"] }

# SHA-256 for backup integrity
sha2 = "0.10"
hex = "0.4"

# Regex for parsing command output
regex = "1"
